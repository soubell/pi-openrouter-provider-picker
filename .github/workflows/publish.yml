name: Publish Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Publish nothing (test only)'
        type: boolean
        default: true

# 誤ったリリースを防ぐため、実行は常に「待機」にする
# (GitHub 画面で Approve するまで publish されない)
concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write   # OIDC に必須（Trusted Publishing 用）
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm   # ←承認ゲート（required reviewer）
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false   # リリースビルドではキャッシュしない

      - name: Verify tag matches package.json version
        if: github.ref_type == 'tag'
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./package.json').version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG"
            exit 1
          fi
          echo "Publishing $PKG"

      - name: Skip if version already exists on npm
        id: already
        run: |
          NAME=$(node -p "require('./package.json').name")
          VER=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VER" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice::$VER is already on npm — skipping publish"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Choose publish mode
        id: mode
        run: |
          if [ "${{ github.ref_type }}" != "tag" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "notice: manual run is test only"
          elif [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "flag=--dry-run" >> "$GITHUB_OUTPUT"
            echo "::notice::dry run — nothing will be published"
          else
            echo "flag=--access public" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.already.outputs.skip != 'true'
        run: npm publish ${{ steps.mode.outputs.flag }}
